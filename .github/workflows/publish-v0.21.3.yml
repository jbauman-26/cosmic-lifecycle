name: Verify Cosmic CLI 0.21.3 installer
on:
  push:
    branches: [release/publish-v0.21.3]
  workflow_dispatch:
permissions: {}
jobs:
  install:
    if: github.repository == 'jbauman-26/cosmic-lifecycle' && github.ref == 'refs/heads/release/publish-v0.21.3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Verify both public release files and install from the documented URL
        shell: bash
        env:
          INSTALLER: https://github.com/jbauman-26/cosmic-lifecycle/releases/latest/download/cosmic-lifecycle.tgz
          VERSIONED: https://github.com/jbauman-26/cosmic-lifecycle/releases/download/v0.21.3/cosmic-lifecycle-0.21.3.tgz
          SHA256: c02074764ca7d8820a16f4f5631447f3c828ce5679ed663be6532bbd7198599b
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 "$INSTALLER" -o cosmic-lifecycle.tgz
          curl -fsSL --retry 3 "$VERSIONED" -o cosmic-lifecycle-0.21.3.tgz
          printf '%s  %s\n' "$SHA256" cosmic-lifecycle.tgz "$SHA256" cosmic-lifecycle-0.21.3.tgz | sha256sum --check
          npm install -g --prefix "$RUNNER_TEMP/cosmic-global" --no-fund --no-audit "$INSTALLER"
          test "$("$RUNNER_TEMP/cosmic-global/bin/cosmic" --version)" = 0.21.3
